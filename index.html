<title>Glyph — statement branding</title>
<style>
  :root {
    --canvas: #fafafa;
    --surface: #ffffff;
    --muted: #f4f4f5;
    --fg: #09090b;
    --fg-2: #52525b;
    --fg-3: #a1a1aa;
    --line: #e4e4e7;
    --line-2: #d4d4d8;
    --primary: #18181b;
    --primary-fg: #fafafa;
    --ring: #a1a1aa;
    --ok: #15803d;
    --ok-bg: #f0fdf4;
    --warn: #b45309;
    --warn-bg: #fffbeb;
    --warn-line: #fde68a;
    --radius: 8px;
    --radius-sm: 6px;
    --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--surface);
    color: var(--fg);
    font-family: var(--ui);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- action bar ---------- */

  .actionbar {
    display: grid;
    grid-template-columns: 340px minmax(0, 1fr);
    align-items: center;
    block-size: 48px;
    border-bottom: 1px solid var(--line);
  }

  .actionbar > .lead {
    padding-inline: 16px;
    border-inline-end: 1px solid var(--line);
    align-self: stretch;
    display: flex;
    align-items: center;
  }

  .actions { display: flex; align-items: center; gap: 2px; padding-inline: 12px 16px; justify-content: flex-end; }
  .actions .sep { inline-size: 1px; block-size: 18px; background: var(--line); margin-inline: 6px; }

  /* ---------- layout ---------- */

  .workbench {
    display: grid;
    grid-template-columns: 340px minmax(0, 1fr);
    align-items: start;
    min-block-size: calc(100vh - 48px);
  }

  @media (max-width: 1040px) {
    .actionbar, .workbench { grid-template-columns: minmax(0, 1fr); }
    .actionbar > .lead { border-inline-end: none; }
    .rail { border-inline-end: none !important; border-bottom: 1px solid var(--line); }
  }

  .rail {
    border-inline-end: 1px solid var(--line);
    padding: 12px 16px 48px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .stage {
    background: var(--canvas);
    align-self: stretch;
    padding: 14px 16px 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-inline-size: 0;
  }

  /* ---------- controls ---------- */

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.disabled input { opacity: .45; pointer-events: none; }

  .fieldlabel {
    font-size: 12px;
    font-weight: 500;
    color: var(--fg);
  }

  .hint { font-size: 12px; color: var(--fg-3); line-height: 1.45; }

  .revertline { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .revertline .changed {
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 1px 7px;
    color: var(--fg-2);
    font-size: 11px;
  }
  .revertline button {
    font: inherit;
    background: none;
    border: 0;
    padding: 0;
    color: var(--fg-2);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .revertline button:hover { color: var(--fg); }

  select, input[type="text"], input[type="url"] {
    font: inherit;
    font-size: 13px;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    block-size: 32px;
    padding: 0 9px;
    inline-size: 100%;
  }

  select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%),
                      linear-gradient(135deg, var(--fg-3) 50%, transparent 50%);
    background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-inline-end: 26px;
  }

  input[type="range"] { inline-size: 100%; accent-color: var(--primary); margin: 0; }

  select:focus-visible, input:focus-visible, button:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 1px;
  }

  .swatchrow { display: flex; align-items: center; gap: 8px; }
  .swatchrow input[type="text"] { font-family: var(--mono); font-size: 12px; text-transform: lowercase; }

  input[type="color"] {
    inline-size: 28px; block-size: 28px;
    padding: 2px;
    border: 1px solid var(--line-2);
    border-radius: var(--radius-sm);
    background: var(--surface);
    flex: none;
    cursor: pointer;
  }

  .checkline { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; cursor: pointer; color: var(--fg); }
  .checkline input { margin: 3px 0 0; accent-color: var(--primary); flex: none; }

  .readout { font-family: var(--mono); font-size: 11.5px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
  .rowlabel { display: flex; align-items: center; gap: 6px; }
  .rowlabel .fieldlabel { margin-inline-end: auto; }

  .ratio {
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    padding: 1px 6px;
    border-radius: 20px;
    white-space: nowrap;
    flex: none;
  }

  .ratio.ok { color: var(--ok); background: var(--ok-bg); }
  .ratio.warn { color: var(--warn); background: var(--warn-bg); box-shadow: inset 0 0 0 1px var(--warn-line); }

  .autobtn {
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .05em;
    font-weight: 600;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg-3);
    border-radius: 20px;
    padding: 1px 7px;
    cursor: pointer;
    flex: none;
  }

  .autobtn[aria-pressed="true"] { background: var(--muted); color: var(--fg-2); }

  /* ---------- collapsible groups ---------- */

  .group { display: flex; flex-direction: column; gap: 8px; }

  .grouphead {
    font: inherit;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--fg-2);
    background: var(--muted);
    border: none;
    border-radius: 20px;
    padding: 3px 10px 3px 7px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    align-self: flex-start;
  }

  .grouphead:hover { color: var(--fg); }
  .chev { inline-size: 12px; block-size: 12px; transition: transform .12s ease; }
  .grouphead[aria-expanded="false"] .chev { transform: rotate(-90deg); }

  .groupbody { display: flex; flex-direction: column; gap: 11px; padding-inline-start: 2px; }

  /* ---------- tabs ---------- */

  .tabs { display: flex; gap: 2px; flex-wrap: wrap; }

  .tab {
    font: inherit;
    font-size: 12.5px;
    border: none;
    background: none;
    color: var(--fg-2);
    padding: 5px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
  }

  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--muted); color: var(--fg); font-weight: 500; }

  .panel { display: flex; flex-direction: column; gap: 14px; }

  /* ---------- buttons ---------- */

  button.action {
    font: inherit;
    font-size: 13px;
    border: 1px solid transparent;
    background: none;
    color: var(--fg-2);
    block-size: 32px;
    padding: 0 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }

  button.action:hover:not(:disabled) { background: var(--muted); color: var(--fg); }
  button.action:disabled { opacity: .35; cursor: default; }

  button.action.primary {
    background: var(--primary);
    color: var(--primary-fg);
    font-weight: 500;
    padding: 0 14px;
  }

  button.action.primary:hover:not(:disabled) { background: var(--primary); opacity: .9; color: var(--primary-fg); }

  .filename { font-family: var(--mono); font-size: 12px; color: var(--fg-3); }

  /* ---------- checks ---------- */

  .stagebar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: space-between; }

  .sample { display: flex; align-items: center; gap: 14px; }
  .sample .field { flex-direction: row; align-items: center; gap: 7px; }
  .sample .fieldlabel { color: var(--fg-3); font-weight: 400; white-space: nowrap; }
  .sample select { inline-size: auto; }
  .sample .hint { display: none; }
  .sample .checkline { color: var(--fg-2); white-space: nowrap; }

  .checks { display: flex; flex-direction: column; gap: 6px; }

  .check {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 9px;
    align-items: start;
    font-size: 12.5px;
    padding: 8px 11px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg-2);
  }

  .check.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
  .check.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok); }

  .check .marker {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 600;
    opacity: .75;
    padding-top: 1px;
  }

  /* ---------- paper ---------- */

  .proof {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    overflow: auto;
  }

  .sheet-scaler { position: relative; margin: 0 auto; }

  .sheet {
    inline-size: 794px; block-size: 1123px;
    border: none;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .08);
    transform-origin: top left;
    display: block;
  }

  /* ---------- css output ---------- */

  .code {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: auto;
    max-block-size: 70vh;
  }

  .code pre { margin: 0; padding: 16px 18px; font-family: var(--mono); font-size: 12px; line-height: 1.65; color: var(--fg); }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="actionbar">
  <div class="lead"><span class="filename" id="filename">acme.css</span></div>
  <div class="actions">
    <button class="action" type="button" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
    <button class="action" type="button" id="redoBtn" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <button class="action" type="button" id="resetBtn">Reset</button>
    <span class="sep"></span>
    <button class="action" type="button" id="shareBtn">Copy link</button>
    <button class="action" type="button" id="copyBtn">Copy CSS</button>
    <button class="action primary" type="button" id="downloadBtn">Download CSS</button>
  </div>
</div>

<div class="workbench">

  <form class="rail" id="controls" autocomplete="off">
    <div id="identity" class="panel"></div>
    <div class="tabs" role="tablist" aria-label="Settings">
      <button class="tab" type="button" role="tab" data-railtab="colour" aria-selected="true">Colour</button>
      <button class="tab" type="button" role="tab" data-railtab="type" aria-selected="false">Type</button>
      <button class="tab" type="button" role="tab" data-railtab="table" aria-selected="false">Table</button>
      <button class="tab" type="button" role="tab" data-railtab="layout" aria-selected="false">Layout</button>
    </div>
    <div class="panel" id="panel-colour" role="tabpanel"></div>
    <div class="panel" id="panel-type" role="tabpanel" hidden></div>
    <div class="panel" id="panel-table" role="tabpanel" hidden></div>
    <div class="panel" id="panel-layout" role="tabpanel" hidden></div>
  </form>

  <main class="stage">

    <div class="stagebar">
      <div class="tabs" role="tablist" aria-label="Proof">
        <button class="tab" type="button" role="tab" data-proof="statement" aria-selected="true">Monthly statement</button>
        <button class="tab" type="button" role="tab" data-proof="css" aria-selected="false">Stylesheet</button>
      </div>
      <div class="sample" id="sample"></div>
    </div>

    <div class="checks" id="checks"></div>

    <section class="proof" id="proof-statement">
      <div class="sheet-scaler" id="scaler-statement"><iframe class="sheet" id="frame-statement" title="Monthly statement proof"></iframe></div>
    </section>

    <section id="proof-css" hidden>
      <div class="code"><pre id="cssOut"></pre></div>
    </section>

  </main>
</div>

<script>
  "use strict";

  const STATE_KEY = "glyph.settings";

  /* ================================================================== *
   * Baseline stylesheets, copied from the document templates so a proof
   * starts from the same defaults the PDF renderer does.
   * exchange: core/src/main/resources/thymeleaf/statement/shared.css
   * ================================================================== */

  const STATEMENT_BASE = `
#page-header { display: inline; }
#page-footer { text-align: right; }
span.page:before { content: counter(page); }
span.pagecount:before { content: counter(pages); }
.document-body { font-family: Inter, sans-serif; font-size: 12px; }
.statement-banner { padding: 10px 20px 10px 20px; }
.document-logo { height: 70px; }
.account-list { width: 60%; }
.account-name { width: 60%; }
#address-details { text-align: right; line-height: 0; }
.document-dates { text-align: right; color: #2B6DB2; }
.data-table {
  border: none; border-collapse: collapse; width: 100%;
  text-align: center; vertical-align: middle;
  padding-right: 20px; padding-left: 20px;
}
.data-table .transaction-amount { text-align: right; }
.data-table thead tr { border: 1px solid; color: white; margin-bottom: 80px; font-weight: normal; }
.data-table th { padding: 10px 0 10px 10px; font-weight: normal; border: 1px solid; text-align: left; }
.data-table td { padding-top: 5px; padding-bottom: 5px; text-align: left; padding-left: 10px; }
`;

  const PLACEHOLDER_LOGO =
    "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80">' +
      '<rect width="320" height="80" fill="none" stroke="#b9bfc7" stroke-dasharray="6 5"/>' +
      '<text x="160" y="45" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" ' +
      'font-size="17" fill="#8b939c">your logo</text></svg>');

  /* ================================================================== *
   * State
   * ================================================================== */

  const DEFAULTS = {
    partner: "acme",
    logoUrl: "",

    previewModel: "trustIndividual",
    previewHoldingAccount: true,

    brand: "#26456b",
    barStyle: "filled",
    barBg: null,
    barText: null,
    sectionBarsMatch: false,
    sectionBg: null,
    sectionText: null,
    dateColour: null,
    accentColour: null,
    bodyTextColour: "#000000",

    fontMode: "builtin",
    builtinFont: "Helvetica, Arial, sans-serif",
    embedFamily: "",
    embedUrl: "",
    fontSize: 12,
    lineHeight: 0,
    titleSize: 0,
    headingSize: 0,
    headingWeight: "",
    upperSections: false,

    tableHeaderStyle: "brandText",
    tableHeaderBg: null,
    tableHeaderText: null,
    upperTableHeader: false,
    headerRadius: 0,
    cellPadding: 5,
    rowLines: false,
    rowLineColour: "#eaecf0",
    rowLineWidth: 1,
    zebra: false,
    zebraColour: null,

    logoHeight: 70,
    logoContain: false,
    logoAlign: "left",
    barPadX: 20,
    barPadY: 10,
    barRadius: 0,
    barSpaceAbove: 0,
    barSpaceBelow: 0,
    summaryWidth: 60,
    summaryCard: false,
    summaryCardBg: null,
    summaryCardText: null,
    summaryCardRadius: 12,
    summaryCardPad: 16,
    summaryCardGap: 10,
    addressSpaced: false,
    addressWidth: 0,
    addressPinned: false,
    addressTop: 32,
    addressRight: 20,
    bodyMargin: 0
  };

  let state = Object.assign({}, DEFAULTS);

  const DEMO_BRAND = "#26456b";

  /* Layout shapes drawn from the stylesheets we host, in a neutral demo
     colour. They set structure only — colour and type are the partner's. */
  const PRESETS = {
    plain: { brand: "#333333", barStyle: "plain", sectionBarsMatch: true, tableHeaderStyle: "brandText", logoHeight: 70 },
    banner: { brand: DEMO_BRAND, barStyle: "filled", sectionBarsMatch: false, tableHeaderStyle: "brandText", logoHeight: 30, logoContain: true, summaryWidth: 100, addressSpaced: true },
    tinted: { brand: DEMO_BRAND, barStyle: "tinted", sectionBarsMatch: true, tableHeaderStyle: "brandText", logoHeight: 30, logoContain: true },
    bold: { brand: DEMO_BRAND, barStyle: "filled", sectionBarsMatch: true, barPadY: 20, barPadX: 20, barSpaceAbove: 20, barSpaceBelow: 10, tableHeaderStyle: "solid", rowLines: true, logoHeight: 40 },
    accent: { brand: DEMO_BRAND, barStyle: "plain", barText: "#000000", sectionBarsMatch: true, tableHeaderStyle: "solid", logoHeight: 50, bodyMargin: 20 },
    minimal: { brand: "#000000", barStyle: "minimal", sectionBarsMatch: true, tableHeaderStyle: "subtle", rowLines: true, logoHeight: 40 },
    striped: { brand: DEMO_BRAND, barStyle: "plain", sectionBarsMatch: true, tableHeaderStyle: "solid", zebra: true, headerRadius: 6, logoHeight: 40 },
    cards: { brand: DEMO_BRAND, bodyTextColour: DEMO_BRAND, barStyle: "plain", sectionBarsMatch: true,
             barPadY: 10, barPadX: 20, barSpaceBelow: 10, logoHeight: 50, logoContain: true,
             fontSize: 11, summaryCard: true, summaryCardText: "#656c7a", summaryCardRadius: 16,
             summaryCardPad: 16, summaryCardGap: 10, tableHeaderStyle: "rule", cellPadding: 10,
             addressSpaced: true, addressWidth: 400, addressPinned: true, bodyMargin: 20 }
  };

  /* ================================================================== *
   * Colour helpers
   * ================================================================== */

  function normaliseHex(value) {
    if (typeof value !== "string") return null;
    let hex = value.trim().toLowerCase();
    const named = { white: "#ffffff", black: "#000000", transparent: null };
    if (Object.prototype.hasOwnProperty.call(named, hex)) return named[hex];
    const rgb = hex.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    if (rgb) {
      return "#" + [1, 2, 3].map(i => Number(rgb[i]).toString(16).padStart(2, "0")).join("");
    }
    if (hex[0] !== "#") hex = "#" + hex;
    if (/^#[0-9a-f]{3}$/.test(hex)) hex = "#" + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
    return /^#[0-9a-f]{6}$/.test(hex) ? hex : null;
  }

  function channelLuminance(c) {
    const v = c / 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  }

  function relativeLuminance(hex) {
    return 0.2126 * channelLuminance(parseInt(hex.slice(1, 3), 16))
         + 0.7152 * channelLuminance(parseInt(hex.slice(3, 5), 16))
         + 0.0722 * channelLuminance(parseInt(hex.slice(5, 7), 16));
  }

  function contrastRatio(a, b) {
    const la = relativeLuminance(a), lb = relativeLuminance(b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  }

  function readableOn(bg) {
    return contrastRatio("#ffffff", bg) >= contrastRatio("#000000", bg) ? "#ffffff" : "#000000";
  }

  function tintOf(hex, amount) {
    const mix = (start) => Math.round(start + (255 - start) * amount);
    return "#" + [
      mix(parseInt(hex.slice(1, 3), 16)),
      mix(parseInt(hex.slice(3, 5), 16)),
      mix(parseInt(hex.slice(5, 7), 16))
    ].map(n => n.toString(16).padStart(2, "0")).join("");
  }

  /* ================================================================== *
   * Derived values — every override falls back to one of these
   * ================================================================== */

  const derive = {
    barBg() {
      if (state.barBg) return state.barBg;
      switch (state.barStyle) {
        case "filled": return state.brand;
        case "tinted": return tintOf(state.brand, 0.86);
        case "plain": return "#ffffff";
        default: return null;
      }
    },
    barText() {
      if (state.barText) return state.barText;
      const bg = derive.barBg();
      if (state.barStyle === "filled" || state.barStyle === "tinted") return readableOn(bg);
      return state.brand;
    },
    sectionBg() {
      if (state.sectionBarsMatch) return derive.barBg();
      return state.sectionBg || "#ffffff";
    },
    sectionText() {
      if (state.sectionBarsMatch) return derive.barText();
      return state.sectionText || state.brand;
    },
    summaryCardBg() { return state.summaryCardBg || tintOf(state.brand, 0.94); },
    summaryCardText() { return state.summaryCardText || state.bodyTextColour; },
    dateColour() { return state.dateColour || state.brand; },
    accentColour() { return state.accentColour || state.brand; },
    zebraColour() { return state.zebraColour || tintOf(state.brand, 0.92); },
    tableHeaderBg() {
      if (state.tableHeaderBg) return state.tableHeaderBg;
      switch (state.tableHeaderStyle) {
        case "solid": return state.brand;
        case "subtle": return "#f9fafb";
        default: return "#ffffff";
      }
    },
    tableHeaderText() {
      if (state.tableHeaderText) return state.tableHeaderText;
      switch (state.tableHeaderStyle) {
        case "solid": return readableOn(state.brand);
        case "subtle": return "#000000";
        default: return state.brand;
      }
    }
  };

  function cssColour(value) { return value === null ? "transparent" : value; }

  /* ================================================================== *
   * Control definitions — the rail is built from this
   * ================================================================== */

  const FONT_OPTIONS = [
    ["Helvetica, Arial, sans-serif", "Helvetica / Arial"],
    ['"Times New Roman", Times, serif', "Times New Roman"],
    ["Courier, monospace", "Courier"]
  ];

  const CONTROLS = [
    /* ---- identity (always visible) ---- */
    { tab: "identity", type: "text", key: "partner", label: "Your name", hint: "Used for the filename only." },
    { tab: "identity", type: "url", key: "logoUrl", label: "Logo image (preview only)", placeholder: "https://…/logo.png",
      hint: "Your logo is not part of this stylesheet — we store it separately." },
    { tab: "identity", type: "select", key: "preset", label: "Start from", transient: true,
      options: [["", "Start from scratch"], ["plain", "Plain — white bars"], ["banner", "Solid banner"],
                ["tinted", "Tinted banner"], ["bold", "Bold — banner and table in brand"],
                ["accent", "Accent table"], ["minimal", "Minimal — no bars"], ["striped", "Striped rows"],
                ["cards", "Cards — shaded summary blocks"]] },

    /* ---- colour ---- */
    { tab: "colour", type: "group", label: "Brand",
      hint: "The figure beside a colour is its contrast with whatever sits behind it. Amber means below 4.5:1, where text starts to be hard to read on paper." },

  /* ================================================================== *
   * Stylesheet generation
   * ================================================================== */

  /* ================================================================== *
   * Input guards
   *
   * Every byte of the stylesheet is written by generateCss() from values
   * that have been through here first, so nothing a user types — or packs
   * into a shared link — can reach the output verbatim.
   * ================================================================== */

  const SPEC = new Map(CONTROLS.filter(c => c.key).map(c => [c.key, c]));

  function safeFamily(value) {
    return String(value || "").replace(/[^A-Za-z0-9 \-]/g, "").trim().slice(0, 60);
  }

  function safeUrl(value) {
    const url = String(value || "").trim().slice(0, 300);
    return /^https?:\/\/[^\s"'()\\<>{}]+$/.test(url) ? url : "";
  }

  function sanitiseState(raw) {
    const clean = Object.assign({}, DEFAULTS);
    if (!raw || typeof raw !== "object") return clean;

    for (const key of Object.keys(DEFAULTS)) {
      if (!(key in raw)) continue;
      const value = raw[key];
      const spec = SPEC.get(key);

      if (key === "embedFamily") { clean[key] = safeFamily(value); continue; }
      if (key === "embedUrl" || key === "logoUrl") { clean[key] = safeUrl(value); continue; }
      if (key === "partner") { clean[key] = String(value ?? "").slice(0, 80); continue; }

      if (!spec) continue;

      switch (spec.type) {
        case "toggle":
          clean[key] = Boolean(value);
          break;
        case "range": {
          const n = Number(value);
          if (Number.isFinite(n)) clean[key] = Math.min(spec.max, Math.max(spec.min, Math.round(n)));
          break;
        }
        case "select":
        case "radio":
          if (spec.options.some(([option]) => option === value)) clean[key] = value;
          break;
        case "colour": {
          if (value === null && spec.derived) { clean[key] = null; break; }
          const hex = normaliseHex(value);
          if (hex) clean[key] = hex;
          break;
        }
      }
    }
    return clean;
  }

  function fontStack() {
    const family = safeFamily(state.embedFamily);
    if (state.fontMode === "embed" && family) {
      return `"${family}", Helvetica, Arial, sans-serif`;
    }
    return SPEC.get("builtinFont").options.some(([o]) => o === state.builtinFont)
      ? state.builtinFont
      : DEFAULTS.builtinFont;
  }

  function rule(selector, declarations) {
    const body = declarations.filter(Boolean).map(d => "  " + d).join("\n");
    return body ? `${selector} {\n${body}\n}` : null;
  }

  function barPadding() {
    const { barPadY: y, barPadX: x } = state;
    if (!y && !x) return "padding: 0;";
    return y === x ? `padding: ${y}px;` : `padding: ${y}px ${x}px;`;
  }

  function barSpacing() {
    return [
      state.barSpaceAbove ? `margin-top: ${state.barSpaceAbove}px;` : null,
      barPadding(),
      state.barSpaceBelow ? `margin-bottom: ${state.barSpaceBelow}px;` : null,
      state.barRadius ? `border-radius: ${state.barRadius}px;` : null
    ];
  }

  function generateCss() {
    const blocks = [];
    const accent = derive.accentColour();

    if (state.fontMode === "embed" && safeFamily(state.embedFamily) && safeUrl(state.embedUrl)) {
      blocks.push(rule("@font-face", [
        `font-family: "${safeFamily(state.embedFamily)}";`,
        `src: url("${safeUrl(state.embedUrl)}");`,
        "-fs-pdf-font-embed: embed;",
        "-fs-pdf-font-encoding: Identity-H;"
      ]));
    }

    blocks.push(rule(".document-body", [
      `font-family: ${fontStack()};`,
      `font-size: ${state.fontSize}px;`,
      state.lineHeight ? `line-height: ${(1 + state.lineHeight / 10).toFixed(1)};` : null,
      state.bodyTextColour !== "#000000" ? `color: ${state.bodyTextColour};` : null,
      state.bodyMargin ? `margin: ${state.bodyMargin}px;` : null
    ]));

    blocks.push("/* Statement-specific selectors (also targets TAF via .section-header) */");

    blocks.push(rule(".account-list", [
      state.summaryWidth !== 60 ? `width: ${state.summaryWidth}%;` : null,
      state.summaryCardText ? `color: ${state.summaryCardText};` : null,
      state.summaryCard ? `background-color: ${cssColour(derive.summaryCardBg())};` : null,
      state.summaryCard && state.summaryCardPad ? `padding: ${state.summaryCardPad}px;` : null,
      state.summaryCard && state.summaryCardRadius ? `border-radius: ${state.summaryCardRadius}px;` : null,
      state.summaryCard && state.summaryCardGap ? `margin-bottom: ${state.summaryCardGap}px;` : null
    ]));

    blocks.push(rule("#address-details", [
      state.addressSpaced ? "line-height: 0.5;" : null,
      state.addressWidth ? `width: ${state.addressWidth}px;` : null,
      state.addressPinned ? "position: absolute;" : null,
      state.addressPinned ? `top: ${state.addressTop}px;` : null,
      state.addressPinned ? `right: ${state.addressRight}px;` : null
    ]));

    if (state.addressSpaced) blocks.push(rule("#address-details p:last-child", ["line-height: 1;"]));

    blocks.push(rule(".section-header", [
      `color: ${derive.sectionText()};`,
      `background-color: ${cssColour(derive.sectionBg())};`,
      ...barSpacing()
    ]));

    blocks.push(rule(".section-header h2", [
      `color: ${derive.sectionText()};`,
      state.headingSize ? `font-size: ${state.headingSize}px;` : null,
      state.headingWeight ? `font-weight: ${state.headingWeight};` : null,
      state.upperSections ? "text-transform: uppercase;" : null
    ]));

    blocks.push(rule(".statement-banner", [
      `color: ${derive.barText()};`,
      `background-color: ${cssColour(derive.barBg())};`,
      ...barSpacing()
    ]));

    blocks.push(rule(".statement-banner h1", ["padding: 0;"]));

    /* Always emitted: the statement title is an h1, so without this id rule
       the TAF `h1 { color: … }` below would recolour it. */
    blocks.push(rule("#statement-header", [
      `color: ${derive.barText()};`,
      state.titleSize ? `font-size: ${state.titleSize}px;` : null,
      state.headingWeight ? `font-weight: ${state.headingWeight};` : null,
      state.upperSections ? "text-transform: uppercase;" : null
    ]));

    blocks.push(rule(".document-dates", ["text-align: right;", `color: ${derive.dateColour()};`, "line-height: 1;"]));
    blocks.push(rule(".account-summary-banner", [`color: ${derive.sectionText()};`]));
    blocks.push(rule("#account-summary-header", [`color: ${derive.sectionText()};`]));
    blocks.push(rule(".transactions-banner", [`color: ${derive.sectionText()};`]));

    blocks.push(rule(".data-table thead tr", ["border: none;", "color: black;", "font-weight: normal;"]));

    blocks.push(rule(".data-table th", [
      `background-color: ${derive.tableHeaderBg()};`,
      `color: ${derive.tableHeaderText()};`,
      "border: none;",
      "font-weight: bold;",
      state.upperTableHeader ? "text-transform: uppercase;" : null,
      state.headerRadius ? `border-radius: ${state.headerRadius}px;` : null,
      state.tableHeaderStyle === "rule"
        ? `border-bottom: 2px solid ${state.brand} !important;`
        : state.tableHeaderStyle === "subtle"
          ? "border-bottom: 1px solid #D0D5DD !important;"
          : "border-bottom: 1px solid #F9FAFB !important;"
    ]));

    /* Row rules go on td, not tr: Flying Saucer draws no border on a table
       row, so the `tbody tr { border-bottom }` several of our hosted files
       use has never appeared in a generated PDF. */
    blocks.push(rule(".data-table td", [
      `padding-top: ${state.cellPadding}px;`,
      `padding-bottom: ${state.cellPadding}px;`,
      state.rowLines ? `border-bottom: ${state.rowLineWidth}px solid ${state.rowLineColour};` : null
    ]));

    if (state.zebra) {
      blocks.push(rule(".data-table tbody tr:nth-child(even)", [`background-color: ${derive.zebraColour()};`]));
    }

    blocks.push(rule(".data-table tbody tr", [`color: ${state.bodyTextColour};`]));

    if (state.rowLines) {
      blocks.push(rule(".account-list td", [`border-bottom: ${state.rowLineWidth}px solid ${state.rowLineColour};`]));
    }

    if (state.logoHeight !== 70 || state.logoContain || state.logoAlign !== "left") {
      blocks.push(rule(".document-logo", [
        `height: ${state.logoHeight}px;`,
        state.logoContain ? "object-fit: contain;" : null,
        state.logoContain ? "margin-bottom: 24px;" : null,
        state.logoAlign !== "left" ? "display: block;" : null,
        state.logoAlign === "center" ? "margin-left: auto;" : null,
        state.logoAlign === "center" ? "margin-right: auto;" : null,
        state.logoAlign === "right" ? "margin-left: auto;" : null
      ]));
    }

    /* Emitted although the transfer form has no proof here: one stylesheet
       covers both documents, so dropping these would leave the form on the
       template's default navy. */
    blocks.push("/* TAF-specific selectors */");
    blocks.push(rule("h1", [`color: ${accent};`]));
    blocks.push(rule("h3", [`color: ${accent};`]));
    blocks.push(rule(".doc-header", [`border-bottom-color: ${accent};`]));
    blocks.push(rule(".subsection", [`border-color: ${accent};`]));

    return blocks.filter(Boolean).join("\n\n") + "\n";
  }

        ["31 Jul 2026", "Easy Access Saver", "Withdrawal to nominated account", "", "£3,500.00", "£25,506.56"]
      ]
    }
  };

  function statementBody(logo) {
    const model = PREVIEW_MODELS[state.previewModel] || PREVIEW_MODELS.trustIndividual;

    const holdingAccount = state.previewHoldingAccount ? `
  <div id="holding-account-details">
    <p>Holding account details: sort code <span>00-00-00</span>, account number <span>81043327</span></p>
  </div>` : "";

    const cashSummary = model.cashSummary ? `
      <table class="account-list">
        <tr style="height:30px"><td style="font-weight:bold">Cash</td></tr>
        <tr><td class="account-name">Holding account</td><td style="text-align:right">£1,204.10</td></tr>
      </table>` : "";

    const rows = model.rows.map(([date, account, description, credit, debit, balance]) =>
      `      <tr><td class="transaction-date">${date}</td><td>${account}</td><td>${description}</td>` +
      `<td class="transaction-amount">${credit}</td><td class="transaction-amount">${debit}</td>` +
      `<td class="transaction-amount">${balance}</td></tr>`).join("\n");

    return `
<div id="front-page">
  <img class="document-logo" src="${logo}" alt="logo">
  <div class="section-header statement-banner"><h1 id="statement-header">Account Statement</h1></div>
  <div id="address-details">
    <p>Mr Smith Bond</p><p>4 Pentonville Rd</p>
    <p>London</p><p>N1 9HF</p><p>United Kingdom</p>
  </div>
  <div class="document-dates"><p><span>01 Jul 2026</span> to <span>31 Jul 2026</span></p></div>${holdingAccount}
  <div id="account-summary">
    <div class="section-header account-summary-banner"><h2 id="account-summary-header">Account Summary</h2></div>
    <div>
      <table class="account-list"><tr><td class="account-name">Total Balance</td><td style="text-align:right">£48,210.66</td></tr></table>${cashSummary}
      <table class="account-list">
        <tr style="height:30px"><td style="font-weight:bold">Savings</td></tr>
        <tr><td class="account-name">1 Year Fixed Saver </td><td style="text-align:right">£25,000.00</td></tr>
        <tr><td class="account-name">Easy Access Saver </td><td style="text-align:right">£12,006.56</td></tr>
        <tr><td class="account-name">95 Day Notice Saver </td><td style="text-align:right">£10,000.00</td></tr>
      </table>
      <table class="account-list">
        <tr style="height:30px"><td style="font-weight:bold">Interest paid over period</td></tr>
        <tr><td class="account-name">GBP </td><td style="text-align:right">£161.42</td></tr>
      </table>
    </div>
  </div>
  <br>
</div>
<div id="transactions">
  <div class="section-header transactions-banner"><h2>Transactions</h2></div>
  <table class="data-table">
    <thead><tr>
      <th>Date</th><th>Account</th><th>Description</th>
      <th class="transaction-amount">Credit</th><th class="transaction-amount">Debit</th><th class="transaction-amount">Balance</th>
    </tr></thead>
    <tbody>
${rows}
    </tbody>
  </table>
</div>`;
  }

  /* ================================================================== *
   * Checks
   * ================================================================== */

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  const MIN_CONTRAST = 4.5;
  const TAB_LABELS = { colour: "Colour", type: "Type", table: "Table", layout: "Layout" };

  /* Deduplicated on the colour pair: a background and its text both carry a
     chip, but they are one failure. */
  function contrastFailures() {
    const seen = new Set(), out = [];
    for (const spec of CONTROLS) {
      if (!spec.contrast || (spec.showIf && !spec.showIf())) continue;
      const [fg, bg] = spec.contrast();
      if (!fg || !bg || seen.has(fg + bg)) continue;
      seen.add(fg + bg);
      const ratio = contrastRatio(fg, bg);
      if (ratio < MIN_CONTRAST) out.push({ spec, ratio });
    }
    return out;
  }

  function buildChecks() {
    const items = [];

    if (state.fontMode === "embed") {
      if (!safeFamily(state.embedFamily)) {
        items.push({ tone: "warn", marker: "Type", text: "Name the font family you want to embed, or your statements will fall back to Helvetica." });
      } else if (!state.embedUrl.trim()) {
        items.push({ tone: "warn", marker: "Type", text:
          `<strong>${escapeHtml(safeFamily(state.embedFamily))} will not appear in the PDF yet.</strong> Fonts have to be embedded as a .ttf file — send us yours and paste back the URL we give you. Until then statements fall back to Helvetica.` });
      } else if (!safeUrl(state.embedUrl)) {
        items.push({ tone: "warn", marker: "Type", text:
          "That font URL was not accepted. It needs to be a plain https address ending in the .ttf file, with no spaces or brackets." });
      }
    }

    const failures = contrastFailures();
    if (failures.length) {
      const tabs = [...new Set(failures.map(f => TAB_LABELS[f.spec.tab]))];
      items.push({ tone: "warn", marker: "Contrast", text:
        failures.map(f => `<strong>${escapeHtml(f.spec.label)}</strong> at ${f.ratio.toFixed(1)}:1`).join(", ") +
        ` — below ${MIN_CONTRAST}:1. Amber chips on the ${tabs.join(" and ")} tab${tabs.length > 1 ? "s" : ""} show every control the same pair affects.` });
    }

    if (state.zebra && state.rowLines) items.push({ tone: "info", marker: "Rows", text:
      "Shaded rows and hairlines together can look busy on a long statement. Most partners use one or the other." });

    return items;
  }

  /* ================================================================== *
   * Rail rendering
   * ================================================================== */

  const el = id => document.getElementById(id);
  const nodes = new Map();

  function makeField(spec) {
    const wrap = document.createElement("div");

    wrap.className = "field";
    const id = "ctl-" + spec.key;
    let input, extra = {};

    const labelRow = document.createElement("div");
    labelRow.className = "rowlabel";
    const label = document.createElement("label");
    label.className = "fieldlabel";
    label.setAttribute("for", id);
    label.textContent = spec.label;
    labelRow.appendChild(label);

    if (spec.type === "range") {
      const out = document.createElement("span");
      out.className = "readout";
      labelRow.appendChild(out);
      extra.readout = out;
    }

    if (spec.contrast) {
      const chip = document.createElement("span");
      chip.className = "ratio";
      labelRow.appendChild(chip);
      extra.chip = chip;
    }

    if (spec.derived) {
      const auto = document.createElement("button");
      auto.type = "button";
      auto.className = "autobtn";
      auto.textContent = "Auto";
      auto.setAttribute("aria-pressed", "true");
      auto.addEventListener("click", () => {
        if (state[spec.key] === null) {
          state[spec.key] = spec.derived() || "#000000";
        } else {
          state[spec.key] = null;
        }
        commit();
      });
      labelRow.appendChild(auto);
      extra.auto = auto;
    }

    if (spec.type !== "toggle" && spec.type !== "colour") wrap.appendChild(labelRow);

    switch (spec.type) {
      case "text":
      case "url":
        input = document.createElement("input");
        input.type = spec.type === "url" ? "url" : "text";
        input.id = id;
        if (spec.placeholder) input.placeholder = spec.placeholder;
        input.addEventListener("input", () => { state[spec.key] = input.value; commit(false); });
        wrap.appendChild(input);
        break;

      case "select":
        input = document.createElement("select");
        input.id = id;
        for (const [value, text] of spec.options) {
          const opt = document.createElement("option");
          opt.value = value; opt.textContent = text;
          input.appendChild(opt);
        }
        input.addEventListener("change", () => {
          if (spec.key === "preset") { applyPreset(input.value); return; }
          state[spec.key] = input.value;
          commit();
        });
        wrap.appendChild(input);

        if (spec.key === "preset") {
          const line = document.createElement("div");
          line.className = "revertline";
          const tag = document.createElement("span");
          tag.className = "changed";
          tag.textContent = "Changed";
          const button = document.createElement("button");
          button.type = "button";
          button.addEventListener("click", revertPreset);
          line.append(tag, button);
          wrap.appendChild(line);
          extra.revert = { wrap: line, button };
        }
        break;

      case "radio": {
        input = document.createElement("div");
        input.id = id;
        extra.radios = [];
        for (const [value, text] of spec.options) {
          const line = document.createElement("label");
          line.className = "checkline";
          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = spec.key;
          radio.value = value;
          radio.addEventListener("change", () => { if (radio.checked) { state[spec.key] = value; commit(); } });
          const span = document.createElement("span");
          span.textContent = text;
          line.append(radio, span);
          input.appendChild(line);
          extra.radios.push(radio);
        }
        wrap.appendChild(input);
        break;
      }

      case "toggle": {
        const line = document.createElement("label");
        line.className = "checkline";
        input = document.createElement("input");
        input.type = "checkbox";
        input.id = id;
        input.addEventListener("change", () => { state[spec.key] = input.checked; commit(); });
        const span = document.createElement("span");
        span.textContent = spec.label;
        line.append(input, span);
        wrap.appendChild(line);
        break;
      }

      case "range":
        input = document.createElement("input");
        input.type = "range";
        input.id = id;
        input.min = spec.min; input.max = spec.max; input.step = spec.step;
        input.addEventListener("input", () => { state[spec.key] = Number(input.value); commit(false); });
        input.addEventListener("change", () => commit());
        wrap.appendChild(input);
        break;

      case "colour": {
        const row = document.createElement("div");
        row.className = "swatchrow";
        input = document.createElement("input");
        input.type = "color";
        input.setAttribute("aria-label", spec.label + " picker");
        const hex = document.createElement("input");
        hex.type = "text";
        hex.id = id;
        hex.spellcheck = false;
        hex.setAttribute("aria-label", spec.label + " hex");
        input.addEventListener("input", () => {
          state[spec.key] = input.value.toLowerCase();
          hex.value = state[spec.key];
          commit(false);
        });
        hex.addEventListener("input", () => {
          const value = normaliseHex(hex.value);
          if (!value) return;
          state[spec.key] = value;
          input.value = value;
          commit(false);
        });
        row.append(input, hex);
        wrap.append(labelRow, row);
        extra.hex = hex;
        break;
      }
    }

    if (spec.hint) {
      const hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = spec.hint;
      wrap.appendChild(hint);
      if (input) input.title = spec.hint;
    }

    return Object.assign({ wrap, input }, extra);
  }

  const CHEVRON =
    '<svg class="chev" viewBox="0 0 12 12" aria-hidden="true">' +
    '<path d="M3 4.5 6 8l3-3.5" fill="none" stroke="currentColor" stroke-width="1.6" ' +
    'stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function makeGroup(spec) {
    const section = document.createElement("section");
    section.className = "group";

    const head = document.createElement("button");
    head.type = "button";
    head.className = "grouphead";
    head.setAttribute("aria-expanded", "true");
    head.innerHTML = CHEVRON + "<span>" + escapeHtml(spec.label) + "</span>";

    const body = document.createElement("div");
    body.className = "groupbody";

    if (spec.hint) {
      const note = document.createElement("span");
      note.className = "hint";
      note.textContent = spec.hint;
      body.appendChild(note);
    }

    head.addEventListener("click", () => {
      const open = head.getAttribute("aria-expanded") === "true";
      head.setAttribute("aria-expanded", String(!open));
      body.hidden = open;
    });

    section.append(head, body);
    return { section, body };
  }

  function buildRail() {
    const open = new Map();
    for (const spec of CONTROLS) {
      const panel = spec.tab === "identity" || spec.tab === "sample"
        ? el(spec.tab)
        : el("panel-" + spec.tab);
      if (spec.type === "group") {
        const { section, body } = makeGroup(spec);
        panel.appendChild(section);
        open.set(panel, body);
        continue;
      }
      const built = makeField(spec);
      (open.get(panel) || panel).appendChild(built.wrap);
      if (spec.key) nodes.set(spec.key, { spec, ...built });
    }
  }

  function syncRail() {
    for (const [key, node] of nodes) {
      const { spec, wrap, input } = node;

      if (spec.showIf) wrap.hidden = !spec.showIf();

      if (spec.key === "preset") {
        input.value = currentPreset;
        if (node.revert) {
          const changed = isModified();
          node.revert.wrap.hidden = !changed;
          if (changed) {
            const name = spec.options.find(([value]) => value === currentPreset);
            node.revert.button.textContent = "Revert to " + (name ? name[1].split(" — ")[0] : "the start");
          }
        }
        continue;
      }

      const derived = spec.derived ? spec.derived() : null;
      const isAuto = spec.derived && state[key] === null;

      if (node.chip) {
        const [fg, bg] = spec.contrast();
        node.chip.hidden = !fg || !bg;
        if (fg && bg) {
          const ratio = contrastRatio(fg, bg);
          const passes = ratio >= MIN_CONTRAST;
          node.chip.textContent = ratio.toFixed(1) + ":1";
          node.chip.className = "ratio " + (passes ? "ok" : "warn");
          node.chip.title = (passes ? "Meets the " : "Below the ") + MIN_CONTRAST + ":1 readability threshold.";
        }
      }

      if (node.auto) {
        node.auto.setAttribute("aria-pressed", String(isAuto));
        node.auto.textContent = isAuto ? "Auto" : "Custom";
        wrap.classList.toggle("disabled", isAuto);
      }

      switch (spec.type) {
        case "text":
        case "url":
          if (input.value !== state[key]) input.value = state[key];
          break;
        case "select":
          input.value = state[key];
          break;
        case "radio":
          node.radios.forEach(r => { r.checked = r.value === state[key]; });
          break;
        case "toggle":
          input.checked = Boolean(state[key]);
          break;
        case "range":
          input.value = state[key];
          node.readout.textContent = spec.format
            ? spec.format(state[key])
            : state[key] + (spec.unit || "");
          break;
        case "colour": {
          const value = normaliseHex(isAuto ? derived : state[key]) || "#ffffff";
          input.value = value;
          if (document.activeElement !== node.hex) node.hex.value = value;
          break;
        }
      }
    }
  }

  /* ================================================================== *
   * History, presets, share
   * ================================================================== */

  const history = { past: [], future: [] };

  /* Edits stick to the layout they were made on, so trying another layout and
     coming back does not throw them away. Keyed by layout name; an entry only
     exists while it differs from the clean layout. */
  const edits = {};
  let currentPreset = "";

  function snapshot() { return JSON.stringify(state); }

  function pushHistory(previous) {
    if (previous === snapshot()) return;
    history.past.push(previous);
    if (history.past.length > 60) history.past.shift();
    history.future.length = 0;
  }

  let pending = null;

  function cleanPreset(value) {
    const keep = {
      partner: state.partner,
      logoUrl: state.logoUrl,
      previewModel: state.previewModel,
      previewHoldingAccount: state.previewHoldingAccount
    };
    return Object.assign({}, DEFAULTS, keep, PRESETS[value] || {});
  }

  function isModified() {
    return snapshot() !== JSON.stringify(cleanPreset(currentPreset));
  }

  function park() {
    if (isModified()) edits[currentPreset] = JSON.parse(snapshot());
    else delete edits[currentPreset];
  }

  function commit(record = true) {
    if (record) {
      pushHistory(pending || snapshot());
      pending = null;
    } else if (pending === null) {
      pending = snapshot();
    }
    render();
  }

  function applyPreset(value) {
    if (value === currentPreset) return;
    pushHistory(snapshot());
    park();
    state = edits[value] ? Object.assign({}, edits[value]) : cleanPreset(value);
    currentPreset = value;
    render();
  }

  function revertPreset() {
    if (!isModified()) return;
    pushHistory(snapshot());
    delete edits[currentPreset];
    state = cleanPreset(currentPreset);
    render();
  }

  function remember() {
    try { localStorage.setItem(STATE_KEY, JSON.stringify({ state, edits, preset: currentPreset })); }
    catch (err) { /* storage blocked or full; the session still works */ }
  }

  /* Through sanitiseState like a shared link: stored settings are no more
     trustworthy than a pasted URL, and the file may predate a control. */
  function recall() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (!raw) return null;
      const saved = JSON.parse(raw);
      const names = new Set(SPEC.get("preset").options.map(([value]) => value));
      const stored = {};
      for (const [name, value] of Object.entries(saved.edits || {})) {
        if (names.has(name)) stored[name] = sanitiseState(value);
      }
      return {
        state: sanitiseState(saved.state),
        edits: stored,
        preset: names.has(saved.preset) ? saved.preset : ""
      };
    } catch (err) {
      return null;
    }
  }

  function encodeState() {
    const diff = {};
    for (const key of Object.keys(DEFAULTS)) {
      if (JSON.stringify(state[key]) !== JSON.stringify(DEFAULTS[key])) diff[key] = state[key];
    }
    return btoa(unescape(encodeURIComponent(JSON.stringify(diff)))).replace(/=+$/, "");
  }

  function decodeState(raw) {
    try {
      return sanitiseState(JSON.parse(decodeURIComponent(escape(atob(raw)))));
    } catch (err) {
      return null;
    }
  }

  /* ================================================================== *
   * Render
   * ================================================================== */

  function slug(value) {
    const cleaned = String(value).trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return cleaned || "branding";
  }

  function proofDocument(base, body) {
    return `<!doctype html><html><head><meta charset="utf-8">
<style>${base}</style>
<style>${generateCss()}</style>
</head><body class="document-body">${body}</body></html>`;
  }

  function fitSheets() {
    for (const [scalerId, frameId] of [["scaler-statement", "frame-statement"]]) {
      const scaler = el(scalerId), frame = el(frameId);
      const available = scaler.parentElement.clientWidth - 44;
      if (available <= 0) continue;
      const scale = Math.min(1, available / 794);
      frame.style.transform = `scale(${scale})`;
      scaler.style.width = (794 * scale) + "px";
      scaler.style.height = (1123 * scale) + "px";
    }
  }

  function render() {
    syncRail();

    const css = generateCss();
    el("cssOut").textContent = css;
    el("filename").textContent = slug(state.partner) + ".css";

    el("checks").innerHTML = buildChecks().map(item =>
      `<div class="check ${item.tone === "info" ? "" : item.tone}">
         <span class="marker">${item.marker}</span><span>${item.text}</span>
       </div>`).join("");

    const logo = state.logoUrl.trim() || PLACEHOLDER_LOGO;
    el("frame-statement").srcdoc = proofDocument(STATEMENT_BASE, statementBody(logo));

    remember();

    el("undoBtn").disabled = history.past.length === 0;
    el("redoBtn").disabled = history.future.length === 0;

    fitSheets();
  }

  /* ================================================================== *
   * Wiring
   * ================================================================== */

  document.querySelectorAll("[data-railtab]").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll("[data-railtab]").forEach(t => {
        const on = t === tab;
        t.setAttribute("aria-selected", String(on));
        el("panel-" + t.dataset.railtab).hidden = !on;
      });
    });
  });

  document.querySelectorAll("[data-proof]").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll("[data-proof]").forEach(t => {
        const on = t === tab;
        t.setAttribute("aria-selected", String(on));
        el("proof-" + t.dataset.proof).hidden = !on;
      });
      if (tab.dataset.proof !== "css") fitSheets();
    });
  });

  function flash(button, text) {
    const original = button.textContent;
    button.textContent = text;
    setTimeout(() => { button.textContent = original; }, 1800);
  }

  el("copyBtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(generateCss()); flash(el("copyBtn"), "Copied"); }
    catch { flash(el("copyBtn"), "Press Ctrl+C"); }
  });

  el("shareBtn").addEventListener("click", async () => {
    const url = location.origin + location.pathname + "#s=" + encodeState();
    window.history.replaceState(null, "", "#s=" + encodeState());
    try { await navigator.clipboard.writeText(url); flash(el("shareBtn"), "Link copied"); }
    catch { flash(el("shareBtn"), "In address bar"); }
  });

  el("downloadBtn").addEventListener("click", () => {
    const blob = new Blob([generateCss()], { type: "text/css" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = slug(state.partner) + ".css";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  });

  el("resetBtn").addEventListener("click", () => {
    pushHistory(snapshot());
    park();
    state = Object.assign({}, DEFAULTS);
    currentPreset = "";
    render();
  });

  el("undoBtn").addEventListener("click", () => {
    if (!history.past.length) return;
    history.future.push(snapshot());
    state = JSON.parse(history.past.pop());
    render();
  });

  el("redoBtn").addEventListener("click", () => {
    if (!history.future.length) return;
    history.past.push(snapshot());
    state = JSON.parse(history.future.pop());
    render();
  });

  document.addEventListener("keydown", event => {
    if (!(event.ctrlKey || event.metaKey) || event.key.toLowerCase() !== "z") return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    event.preventDefault();
    (event.shiftKey ? el("redoBtn") : el("undoBtn")).click();
  });

  el("controls").addEventListener("submit", event => event.preventDefault());
  window.addEventListener("resize", fitSheets);

  buildRail();

  function applyHash() {
    if (!location.hash.startsWith("#s=")) return false;
    const decoded = decodeState(location.hash.slice(3));
    if (!decoded) return false;
    park();
    state = decoded;
    currentPreset = "";
    return true;
  }

  /* A pasted link while the page is already open changes only the fragment,
     which is a same-document navigation — without this the settings in the
     link would silently do nothing. */
  window.addEventListener("hashchange", () => {
    const previous = snapshot();
    if (!applyHash()) return;
    pushHistory(previous);
    render();
  });

  const saved = recall();
  if (saved) {
    state = saved.state;
    Object.assign(edits, saved.edits);
    currentPreset = saved.preset;
  }
  applyHash();

  render();
</script>
